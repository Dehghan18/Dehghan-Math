<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17102f"><title>آزمایشگاه جادویی خط‌ها | آکادمی ریاضی دهقان</title><style>
:root{--bg:#140e2d;--panel:#29204a;--panel2:#352958;--edge:#715aa0;--mint:#66eadc;--pink:#ff83c9;--gold:#ffd36c;--ink:#fff8ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% 0,#244777 0,transparent 35%),radial-gradient(circle at 5% 25%,#54246a 0,transparent 35%),var(--bg);color:var(--ink);font-family:Tahoma,'Vazirmatn',Arial,sans-serif;line-height:1.85;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}a{color:var(--mint)}.wrap{max-width:850px;margin:auto;padding:18px 13px 48px}.hero{text-align:center;padding:24px 10px 18px}.eyebrow{display:inline-block;padding:5px 16px;border:1px solid #a179d3;border-radius:99px;background:#51376c;color:#ffe2a2;font-size:.85rem}.hero h1{font-size:clamp(1.65rem,6vw,2.8rem);line-height:1.6;margin:13px 0;color:var(--gold)}.hero p{margin:0 auto;max-width:650px;color:#e1d4f4}.shine{font-size:1.5rem;letter-spacing:12px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.pill{border:1px solid var(--edge);border-radius:16px;background:#352852;padding:10px 5px;text-align:center;font-size:.82rem}.pill strong{display:block;color:var(--gold);font-size:1.05rem}.progress{height:12px;background:#49375f;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--mint),var(--pink));transition:width .35s}.nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:16px 0}.nav button{border:1px solid #7e659e;background:#382953;color:white;border-radius:13px;min-height:60px;padding:5px 2px;font-size:.75rem}.nav button span{display:block;font-size:1.35rem}.nav button.active{background:#714078;outline:2px solid var(--gold)}.card{background:linear-gradient(145deg,#352751,#241b42);border:1px solid var(--edge);border-radius:25px;padding:clamp(15px,4vw,30px);box-shadow:0 15px 38px #0b08283d;margin:15px 0}.card h2{font-size:clamp(1.3rem,4.8vw,1.9rem);color:var(--gold);margin:0 0 8px}.card h3{color:var(--mint);margin:16px 0 8px}.muted{color:#e3d4f5}.tip{background:#47345e;border-right:5px solid var(--mint);padding:12px 15px;border-radius:15px;margin:13px 0}.play{background:#1d1737;border:1px solid #745f99;border-radius:20px;padding:14px;margin:15px 0;overflow:hidden}.play svg{display:block;width:100%;height:auto;max-height:340px;touch-action:none}.math{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-family:Tahoma,Arial,sans-serif;font-weight:700;font-variant-numeric:normal}.equation{display:block;text-align:center;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;white-space:normal;background:#19132f;border:1px solid #625081;padding:12px;border-radius:13px;font-size:clamp(1.02rem,4vw,1.45rem);margin:10px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0}.btn{border:1px solid #9872c1;border-radius:14px;background:#503967;color:#fff;padding:10px 16px;min-height:45px}.btn.primary{background:linear-gradient(125deg,#ff87c8,#b77cff);color:#221032;font-weight:900;border:0}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.selected{border-color:var(--mint);background:#1c635e}.btn.good{background:#17695e;border-color:#6af3ca}.btn.bad{background:#743d56;border-color:#ff9ab0}.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0}.choice button{min-width:0;overflow-wrap:anywhere}.answer{border-radius:13px;padding:12px;background:#4a3764;margin:12px 0;min-height:50px}.answer.ok{background:#1b665d}.answer.no{background:#793e54}.range{width:100%;accent-color:var(--pink);height:35px}.flexbetween{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bottom{display:flex;justify-content:space-between;gap:10px;margin:18px 0}.bottom button{flex:1}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.steps div{background:#46345f;padding:8px;text-align:center;border-radius:12px}.hero-cover{display:block;width:min(100%,560px);aspect-ratio:900/560;object-fit:cover;border-radius:24px;margin:0 auto 16px;box-shadow:0 18px 42px #05031870}.footer{text-align:center;margin-top:30px;color:#d7c6e8;font-size:.85rem}.footer p{margin:4px}.footer p:nth-child(2){font-size:.9rem}.angle-hat{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;padding-top:.46em;direction:ltr;unicode-bidi:isolate;line-height:1.2}.angle-hat::before{content:"⌃";position:absolute;top:-.16em;left:50%;transform:translateX(-50%);font-size:.82em;line-height:1;color:var(--gold)}.angle-degree{display:inline-block;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:800}.law-art svg,.quiz-art svg{display:block;width:100%;height:auto;max-height:240px;touch-action:none}.law-art,.quiz-art{border-radius:17px;background:#19132f;border:1px solid #715a9a;padding:8px;margin:12px 0}.law-range{width:100%;accent-color:var(--pink)}.drag-hint{font-size:.8rem;color:#e2d5f3;text-align:center}.math{white-space:nowrap}.equation{overflow-wrap:normal;overflow-x:auto}.choice button{color:#fff}.angle-hat.in-svg{color:var(--gold)}.kbd{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kbd button{padding:10px}.badge{color:var(--mint);font-weight:800}.small{font-size:.85rem}.symbol{font-family:Arial,Tahoma,sans-serif}.hidden{display:none!important}@media(max-width:440px){.wrap{padding:12px 9px 40px}.card{border-radius:18px;padding:15px 12px}.nav{gap:3px}.nav button{font-size:.65rem;min-height:54px}.choice{gap:7px}.btn{padding:9px 10px;font-size:.88rem}.pill{font-size:.7rem}.hero h1{font-size:1.65rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="hero"><img class="hero-cover" src="../../lesson-art/chapter-03/parallel-perpendicular.webp" alt="تصویر سه‌بعدی خطوط موازی و عمود" loading="eager"><div class="shine">✦ ✧ ✦</div><div class="eyebrow">🎮 ریاضی هشتم • فصل سوم • توازی و تعامد</div><h1>آزمایشگاه جادویی خط‌ها</h1><p>خط‌ها را حرکت بده، زاویه‌ها را کشف کن و با حل مأموریت‌ها به استاد هندسه تبدیل شو!</p></header><div class="status"><div class="pill">ایستگاه<strong id="stageNo">۱ از ۷</strong></div><div class="pill">ستاره‌ها<strong id="score">۰ ⭐</strong></div><div class="pill">نشان‌ها<strong id="badges">۰ از ۷</strong></div></div><div class="progress" aria-label="پیشرفت"><div id="bar" style="width:14.3%"></div></div><nav class="nav" id="nav" aria-label="انتخاب ایستگاه"></nav><section class="card" id="content" aria-live="polite"></section><div class="bottom"><button class="btn" id="prev">→ مرحله قبل</button><button class="btn primary" id="next">مرحله بعد ←</button></div><footer class="footer"><p>آکادمی ریاضی دهقان</p><p>ریاضی پایه هشتم | فصل سوم | صفحات ۳۴ تا ۳۷</p><p><a href="../../chapter-03.html">بازگشت به فصل سوم</a></p></footer></main><script>
'use strict';
const fa=n=>String(n).replace(/[0-9]/g,c=>'۰۱۲۳۴۵۶۷۸۹'[+c]);
const signed=n=>(n<0?'−':n>0?'+':'')+fa(Math.abs(n));
const math=s=>'<span class="math" dir="ltr">'+s+'</span>';
const deg=n=>'<bdi class="angle-degree" dir="ltr">'+fa(n)+'°</bdi>';
const hat=n=>'<span class="angle-hat">'+fa(n)+'</span>';
const fixDegrees=s=>s.replace(/([۰-۹]+)°/g,(_,n)=>'<bdi class="angle-degree" dir="ltr">'+n+'°</bdi>');
const fixMath=s=>s.replace(/∠([۱۲۳۴۵۶۷۸۹۰])/g,(_,n)=>hat('۰۱۲۳۴۵۶۷۸۹'.indexOf(n))); 
const eq=s=>'<div class="equation" dir="ltr">'+s+'</div>';
const $=id=>document.getElementById(id);
let stage=0,points=0,earned=new Set(),chosen=null,quizIndex=0,quizDone=new Set();
const icons=['🚆','📐','📏','🧩','🔑','🏗️','🏆'];
const names=['ریل‌ها','زاویه‌ها','تعامد','مهندس','قانون‌ها','شکل‌ها','قهرمانی'];
function award(key){if(earned.has(key))return;earned.add(key);points+=10;updateStatus();}
function updateStatus(){ $('stageNo').textContent=fa(stage+1)+' از ۷';$('score').textContent=fa(points)+' ⭐';$('badges').textContent=fa(new Set([...earned].map(x=>x.split(':')[0])).size)+' از ۷';$('bar').style.width=((stage+1)/7*100)+'%';document.querySelectorAll('.nav button').forEach((b,i)=>{b.classList.toggle('active',i===stage);b.setAttribute('aria-current',i===stage?'step':'false')});$('prev').disabled=stage===0;$('next').textContent=stage===6?'🏆 مشاهده کارنامه':'مرحله بعد ←'}
function drawNav(){ $('nav').innerHTML=names.map((n,i)=>'<button type="button" data-stage="'+i+'"><span>'+icons[i]+'</span>'+n+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.stage))}
function go(n){if(n<0)return;if(n>6){go(6);return;}stage=n;chosen=null;render();requestAnimationFrame(()=>{const y=$('content').getBoundingClientRect().top+window.scrollY-12;window.scrollTo({top:y,behavior:'smooth'})})}
function reply(text,ok=false){const e=$('feedback');if(e){e.className='answer '+(ok?'ok':'no');e.innerHTML=fixDegrees(text);}if(ok)award(stage+':main')}
function svgFrame(inner){return '<div class="play"><svg viewBox="0 0 340 220" role="img" aria-label="شکل هندسی تعاملی">'+inner+'</svg></div>'}
const line=(x1,y1,x2,y2,color='#66eadc',w=4)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
function axis(){let s=line(22,125,318,125,'#b8a2e8',3);for(let i=-5;i<=5;i++){let x=170+i*26;s+=line(x,118,x,132,'#a99bce',2)+`<text x="${x}" y="153" text-anchor="middle" fill="#fff" font-size="12">${fa(i)}</text>`}return s}
function stage1(){return `<h2>🚆 ایستگاه ۱: ریل‌های موازی</h2><p>دو ریل قطار اگر در یک صفحه همیشه با فاصله ثابت کنار هم پیش بروند، با هم <b>موازی</b> هستند.</p><div class="tip">نماد دو خط موازی: ${math('a ∥ b')} . خطی که دو خط را قطع کند، <b>خط مورب</b> نام دارد.</div><h3>🎮 ریل دوم را جابه‌جا کن</h3><p>با نوار زیر فاصله ریل‌ها را تغییر بده. آیا با تغییر فاصله، ریل‌ها همچنان موازی‌اند؟</p><div id="railArt"></div><input class="range" id="railRange" type="range" min="30" max="95" value="58" aria-label="فاصله دو ریل"><div class="flexbetween"><span>فاصله ریل‌ها: <b id="railLabel"></b></span><span class="badge">${math('a ∥ b')}</span></div><div class="choice"><button class="btn" data-rail="yes">بله، موازی‌اند</button><button class="btn" data-rail="no">نه، موازی نیستند</button></div><div id="feedback" class="answer">یک پاسخ انتخاب کن تا قانون را کشف کنی.</div>`}
function railUpdate(){let d=+$('railRange').value;$('railLabel').textContent=fa(d)+' واحد نمایشی';$('railArt').innerHTML=svgFrame(line(22,62,318,62,'#69e5dc',7)+line(22,62+d,318,62+d,'#ff8acb',7)+Array.from({length:8},(_,i)=>line(35+i*38,62,35+i*38,62+d,'#ffd36c',2)).join('')+`<text x="300" y="48" fill="#69e5dc">a</text><text x="300" y="${55+d}" fill="#ff8acb">b</text>`)}
let draggingAngle=null;
function stage2(){return `<h2>📐 ایستگاه ۲: شکارچی زاویه‌ها</h2><p>یک خط مورب، دو خط موازی را قطع می‌کند. زاویه‌های <b>متناظر</b> برابرند؛ زاویه‌های <b>متقابل به رأس</b> نیز برابرند.</p><div class="tip">دو زاویه مجاور روی یک خط راست <b>مکمل</b> هستند؛ مجموعشان ${deg(180)} است.</div><h3>🔬 آزمایش زاویه زنده</h3><p>خط صورتی را با انگشت یا ماوس به چپ و راست بکش؛ برای تغییر شیب، نوار را حرکت بده. کمان و نام هر زاویه همراه خط حرکت می‌کنند.</p><div id="angleArt"></div><div class="drag-hint">👆 خط صورتی را بکش و جابه‌جا کن</div><input id="angleRange" class="range" type="range" min="45" max="80" value="55" aria-label="اندازه زاویه"><div class="steps"><div>زاویه ${hat(1)}<br><b id="ang1"></b></div><div>زاویه ${hat(2)}<br><b id="ang2"></b></div><div>مکمل<br><b id="ang3"></b></div></div><h3>🎯 مأموریت</h3><p>اگر یکی از زاویه‌های متناظر ${deg(60)} باشد، زاویه متناظر دیگر چند درجه است؟</p><div class="choice"><button class="btn" data-angle="60">${deg(60)}</button><button class="btn" data-angle="120">${deg(120)}</button></div><div id="feedback" class="answer">زاویه‌ها را بررسی کن.</div>`}

let angleShift=0;
function angleUpdate(){const a=+$('angleRange').value,rad=a*Math.PI/180,dx=95/Math.tan(rad),bottom=155+angleShift,top=bottom+dx;
const label=(x,y,n)=>`<g transform="translate(${x+42*Math.cos(rad/2)},${y-42*Math.sin(rad/2)})"><path d="M-6,-17 L0,-23 L6,-17" stroke="#ffd36c" stroke-width="2.2" fill="none"/><text x="0" y="0" text-anchor="middle" fill="#ffd36c" font-size="18" font-weight="bold">${fa(n)}</text></g>`;
const arc=(x,y)=>`<path d="M${x+28},${y} A28,28 0 0 0 ${x+28*Math.cos(rad)},${y-28*Math.sin(rad)}" fill="none" stroke="#ffd36c" stroke-width="3.5"/>`;
let s=line(16,65,324,65)+line(16,160,324,160)+line(bottom-55/Math.tan(rad),215,top+45/Math.tan(rad),20,'#ff86cb',5);
s+=arc(top,65)+arc(bottom,160)+label(top,65,1)+label(bottom,160,2)+`<circle cx="${top}" cy="65" r="5" fill="#ffd36c"/><circle cx="${bottom}" cy="160" r="5" fill="#ffd36c"/><text x="22" y="51" fill="#66eadc">a</text><text x="22" y="146" fill="#66eadc">b</text><text x="172" y="210" text-anchor="middle" fill="#fff">a ∥ b</text>`;
$('angleArt').innerHTML=svgFrame(s);$('ang1').innerHTML=deg(a);$('ang2').innerHTML=deg(a);$('ang3').innerHTML=deg(180-a);

}

function stage3(){return `<h2>📏 ایستگاه ۳: مأموریت تعامد</h2><p>دو خط وقتی <b>عمود</b> هستند که زاویه بین آن‌ها قائمه باشد.</p><div class="tip">نماد عمود بودن: ${math('a ⊥ b')} ؛ زاویه قائمه ${math('۹۰°')} است.</div><h3>🎮 خط صورتی را بچرخان</h3><p>خط را دقیقاً روی زاویه قائمه تنظیم کن و دکمه بررسی را بزن.</p><div id="perpArt"></div><input class="range" id="perpRange" type="range" min="45" max="135" step="5" value="65"><div class="flexbetween"><span>زاویه فعلی: <b id="perpVal"></b></span><button class="btn primary" id="checkPerp">بررسی تعامد</button></div><div id="feedback" class="answer">هدف: زاویه ${math('۹۰°')}</div>`}
function perpUpdate(){let a=+$('perpRange').value,r=a*Math.PI/180;let s=line(25,125,315,125)+line(170-105*Math.cos(r),125+105*Math.sin(r),170+105*Math.cos(r),125-105*Math.sin(r),'#ff87c9',5);if(a===90)s+=`<path d="M 170 105 h 20 v 20" fill="none" stroke="#ffd36c" stroke-width="3"/>`;$('perpArt').innerHTML=svgFrame(s);$('perpVal').innerHTML=deg(a)}
function stage4(){return `<h2>🧩 ایستگاه ۴: مهندس خط‌کش</h2><p>برای رسم خط موازی روی صفحه شطرنجی، می‌توانیم از <b>حرکت افقی و عمودی یکسان</b> استفاده کنیم.</p><div class="tip">اگر خط اول با حرکت ${math('۳')} خانه به راست و ${math('۲')} خانه به بالا رسم شده، خط موازی هم باید همین الگوی حرکت را داشته باشد.</div><h3>🏗️ خط دوم را بساز</h3><p>با دکمه‌ها تعداد خانه‌های حرکت به راست و بالا را انتخاب کن.</p><div id="gridArt"></div><div class="controls"><span>به راست:</span><button class="btn" id="rxDown">−</button><b id="rxVal">۳</b><button class="btn" id="rxUp">+</button></div><div class="controls"><span>به بالا:</span><button class="btn" id="ryDown">−</button><b id="ryVal">۲</b><button class="btn" id="ryUp">+</button></div><button class="btn primary" id="gridCheck">بررسی موازی بودن</button><div id="feedback" class="answer">الگوی خط اول را پیدا کن.</div>`}
let rx=2,ry=1;
function gridUpdate(){ $('rxVal').textContent=fa(rx);$('ryVal').textContent=fa(ry);let s='';for(let x=20;x<=320;x+=25)s+=line(x,15,x,215,'#473b65',1);for(let y=15;y<=215;y+=25)s+=line(20,y,320,y,'#473b65',1);s+=line(45,155,120,105,'#66eadc',5)+line(170,190,170+rx*25,190-ry*25,'#ff87c9',5)+`<text x="55" y="94" fill="#66eadc">d</text><text x="173" y="211" fill="#ff87c9">e</text>`;$('gridArt').innerHTML=svgFrame(s)}
const laws=[{q:'اگر دو خط بر یک خط عمود باشند، نسبت به هم چه وضعیتی دارند؟',opts:['موازی‌اند','حتماً متقاطع‌اند'],a:0,why:'دو خط عمود بر یک خط، با هم موازی‌اند.'},{q:'اگر دو خط با یک خط موازی باشند، نسبت به هم چه وضعیتی دارند؟',opts:['موازی‌اند','عمودند'],a:0,why:'دو خط موازی با یک خط، با هم موازی‌اند.'},{q:'اگر خطی بر یکی از دو خط موازی عمود باشد، با خط دیگر چه رابطه‌ای دارد؟',opts:['عمود است','موازی است'],a:0,why:'خطی که بر یکی از دو خط موازی عمود است، بر دیگری نیز عمود است.'}];
let lawIdx=0;
let lawOffsets=[0,0,0];
function lawGraphic(i){const v=lawOffsets[i],cy='#66eadc',pink='#ff87c9',gold='#ffd36c';let z='';
if(i===0){let x=230+v;z=line(25,110,315,110,pink,5)+line(95,22,95,195,cy,5)+line(x,22,x,195,cy,5)+`<path d="M95 110 v-16 h16 v16 M${x} 110 v-16 h16 v16" stroke="${gold}" stroke-width="3" fill="none"/><text x="77" y="18" fill="white">a</text><text x="${x+12}" y="18" fill="white">b</text><text x="292" y="102" fill="white">c</text>`}
if(i===1){let y=110+v;z=line(25,48,315,48,cy,5)+line(25,y,315,y,gold,5)+line(25,180,315,180,cy,5)+`<text x="35" y="38" fill="white">a</text><text x="35" y="${y-10}" fill="white">b</text><text x="35" y="170" fill="white">c</text>`}
if(i===2){let x=170+v;z=line(25,50,315,50,cy,5)+line(25,164,315,164,cy,5)+line(x,12,x,207,pink,5)+`<path d="M${x} 50 v-15 h15 v15 M${x} 164 v-15 h15 v15" stroke="${gold}" stroke-width="3" fill="none"/><text x="35" y="40" fill="white">a</text><text x="35" y="154" fill="white">b</text><text x="${x+12}" y="20" fill="white">c</text>`}
return `<div class="law-art"><svg viewBox="0 0 340 220" aria-label="نمایش هندسی قانون ${fa(i+1)}">${z}</svg></div><label class="small" for="lawSlide">🎮 شکل را جابه‌جا کن و رابطه خط‌ها را مشاهده کن</label><input id="lawSlide" class="law-range" type="range" min="${i===0?-65:i===1?-28:-65}" max="${i===0?65:i===1?28:65}" value="${v}">`;
}

function stage5(){return `<h2>🔑 ایستگاه ۵: سه قانون طلایی</h2><p>قانون‌ها را با یک بازی کوتاه کشف کن. برای هر قانون، پاسخ درست را انتخاب کن.</p><div class="tip">در این مرحله، هر بار یک قانون جدید باز می‌شود.</div><div id="lawBox"></div><div id="feedback" class="answer">برای شروع آماده‌ای؟</div>`}
function lawRender(){const l=laws[lawIdx];$('lawBox').innerHTML=`<div class="play"><span class="badge">قانون ${fa(lawIdx+1)} از ۳</span><h3>${l.q}</h3>${lawGraphic(lawIdx)}<div class="choice">${l.opts.map((x,i)=>`<button class="btn" data-law="${i}">${x}</button>`).join('')}</div><button class="btn primary hidden" id="lawNext">قانون بعدی ←</button></div>`;
$('lawSlide').oninput=e=>{lawOffsets[lawIdx]=+e.target.value;const box=$('lawBox').querySelector('.law-art');const tmp=document.createElement('div');tmp.innerHTML=lawGraphic(lawIdx);box.replaceWith(tmp.querySelector('.law-art'))};
$('lawBox').querySelectorAll('[data-law]').forEach(b=>b.onclick=()=>{let ok=+b.dataset.law===l.a;reply((ok?'آفرین! ':'دوباره فکر کن. ')+l.why,ok);if(ok){award('5:'+lawIdx);$('lawBox').querySelectorAll('[data-law]').forEach(x=>x.disabled=true);$('lawNext').classList.remove('hidden');$('lawNext').textContent=lawIdx===2?'تمام قوانین را یاد گرفتم ✓':'قانون بعدی ←'}});
$('lawNext').onclick=()=>{if(lawIdx<2){lawIdx++;lawRender();$('feedback').textContent='قانون بعدی را کشف کن.'}else reply('هر سه قانون را کشف کردی! حالا برای ساخت شکل‌ها آماده‌ای.',true)}}

let skew=42,tri=70;
function stage6(){return `<h2>🏗️ ایستگاه ۶: سازنده شکل‌ها</h2><p>در متوازی‌الاضلاع، <b>ضلع‌های روبه‌رو موازی‌اند</b>. شکل را تغییر بده و ببین این ویژگی از بین نمی‌رود.</p><div id="shapeArt"></div><label for="skewRange">جابه‌جایی رأس‌های بالا</label><input class="range" id="skewRange" type="range" min="-50" max="65" value="42"><div class="tip">${math('AB ∥ DC')} و ${math('AD ∥ BC')} . زاویه‌های روبه‌رو نیز برابرند.</div><h3>🔺 آزمایش مثلث متساوی‌الساقین</h3><p>رأس بالایی را جابه‌جا کن؛ وقتی روی وسط قاعده قرار بگیرد، دو ساق برابر می‌شوند.</p><div id="triangleArt"></div><input class="range" id="triRange" type="range" min="-70" max="70" step="5" value="40"><button class="btn primary" id="shapeCheck">بررسی خط تقارن</button><div id="feedback" class="answer">رأس را روی وسط قاعده تنظیم کن.</div>`}
function shapeUpdate(){let k=+ $('skewRange').value;let s=`<polygon points="70,170 245,170 ${245+k},70 ${70+k},70" fill="#44c7bc33" stroke="#66eadc" stroke-width="4"/><text x="55" y="184" fill="#fff">D</text><text x="250" y="184" fill="#fff">C</text><text x="${248+k}" y="59" fill="#fff">B</text><text x="${55+k}" y="59" fill="#fff">A</text>`;$('shapeArt').innerHTML=svgFrame(s);let t=+ $('triRange').value;let x=170+t;s=`<polygon points="65,180 275,180 ${x},45" fill="#ff87c922" stroke="#ff87c9" stroke-width="4"/>${line(170,180,170,45,'#ffd36c',2)}<circle cx="${x}" cy="45" r="7" fill="#ffd36c"/><text x="170" y="208" text-anchor="middle" fill="#fff">وسط قاعده</text>`;$('triangleArt').innerHTML=svgFrame(s)}
const quiz=[{q:'اگر دو زاویه متناظر روی خط‌های موازی باشند و یکی ۷۰ درجه باشد، دیگری چند درجه است؟',e:'∠۱ = ∠۲',o:['۷۰°','۱۱۰°','۹۰°','۲۰°'],a:0,why:'زاویه‌های متناظر برابرند؛ پس زاویه دوم ۷۰° است.'},{q:'مکمل زاویه ۳۶ درجه چند درجه است؟',e:'۱۸۰° − ۳۶° = ؟',o:['۱۴۴°','۳۶°','۵۴°','۱۲۶°'],a:0,why:'مجموع زاویه‌های مکمل ۱۸۰° است؛ بنابراین ۱۸۰ − ۳۶ = ۱۴۴.'},{q:'اگر دو خط بر یک خط سوم عمود باشند، نسبت به هم چه رابطه‌ای دارند؟',e:'a ⊥ c , b ⊥ c',o:['موازی‌اند','عمودند','هیچ‌کدام'],a:0,why:'دو خط عمود بر یک خط، با هم موازی‌اند.'},{q:'اگر زاویه‌ای ۱۵۵ درجه باشد، زاویه مجاور آن روی خط راست چند درجه است؟',e:'۱۸۰° − ۱۵۵° = ؟',o:['۲۵°','۳۵°','۱۵۵°','۴۵°'],a:0,why:'زاویه‌های مجاور روی خط راست مکمل‌اند؛ ۱۸۰ − ۱۵۵ = ۲۵.'},{q:'در یک متوازی‌الاضلاع، کدام ضلع‌ها موازی‌اند؟',e:'ABCD',o:['ضلع‌های روبه‌رو','ضلع‌های مجاور','همه ضلع‌ها'],a:0,why:'در متوازی‌الاضلاع، هر دو ضلع روبه‌رو موازی‌اند.'},{q:'اگر دو خط موازی را خطی عمود بر یکی قطع کند، زاویه برخورد با خط دیگر چند درجه است؟',e:'a ∥ b , d ⊥ a',o:['۹۰°','۶۰°','۱۸۰°','۴۵°'],a:0,why:'خطی که بر یکی از دو خط موازی عمود باشد، بر دیگری هم عمود است.'}];
function quizGraphic(i){
const c='#66eadc',p='#ff87c9',g='#ffd36c',other='#ad91ff';let z='';
const L=(x,y,t,color=g,size=18)=>`<text x="${x}" y="${y}" text-anchor="middle" direction="ltr" unicode-bidi="isolate" fill="${color}" font-family="Tahoma,Arial,sans-serif" font-weight="bold" font-size="${size}">${t}</text>`;
const right=(x,y,dx=1,dy=-1)=>`<path d="M ${x+dx*17} ${y} v ${dy*17} h ${-dx*17}" stroke="${g}" stroke-width="3" fill="none"/>`;
const sector=(x,y,r,start,end,color=g)=>{const a=start*Math.PI/180,b=end*Math.PI/180;return `<path d="M ${x+r*Math.cos(a)} ${y-r*Math.sin(a)} A ${r} ${r} 0 ${Math.abs(end-start)>180?1:0} ${end>start?0:1} ${x+r*Math.cos(b)} ${y-r*Math.sin(b)}" stroke="${color}" stroke-width="3.5" fill="none"/>`};
if(i===0){
// Both arcs share the same sector, each anchored to its actual intersection.
const xTop=184.6,xBottom=150,theta=70;
z=line(22,58,318,58,c,4)+line(22,153,318,153,c,4)+line(130,208,202,10,p,4);
z+=sector(xTop,58,25,0,theta)+sector(xBottom,153,25,0,theta);
z+=L(223,36,'۷۰°')+L(187,128,'?',g,23);
}
if(i===1){
const x=170,y=146,theta=36;
z=line(26,y,314,y,c,4)+line(x,y,267,75,p,4);
z+=sector(x,y,36,0,theta,g)+sector(x,y,46,theta,180,other);
z+=L(224,122,'۳۶°')+L(113,105,'?',other,23)+`<circle cx="${x}" cy="${y}" r="5" fill="${g}"/>`;
}
if(i===2){z=line(30,105,310,105,p,5)+line(105,25,105,195,c,5)+line(235,25,235,195,c,5)+right(105,105)+right(235,105)+L(83,25,'a','#fff')+L(247,25,'b','#fff')+L(301,94,'c','#fff')}
if(i===3){
const x=170,y=142,theta=25;
z=line(25,y,315,y,c,4)+line(x,y,274,93,p,4);
z+=sector(x,y,36,theta,180,g)+sector(x,y,46,0,theta,other);
z+=L(118,116,'۱۵۵°',g,17)+L(213,102,'?',other,23);
}
if(i===4){
// Single arrow on each oblique side, double arrow on horizontal sides; no diagonals.
z=`<polygon points="76,161 270,161 229,58 35,58" fill="#66eadc22" stroke="${c}" stroke-width="5"/>`;
z+=L(25,49,'A','#fff',16)+L(243,49,'B','#fff',16)+L(283,179,'C','#fff',16)+L(65,179,'D','#fff',16);
const arrows=(x,y,ux,uy,n)=>{let q='';const vx=-uy,vy=ux;for(let j=0;j<n;j++){let px=x+(j-(n-1)/2)*12*ux,py=y+(j-(n-1)/2)*12*uy;q+=`<path d="M ${px-7*ux-6*vx} ${py-7*uy-6*vy} L ${px} ${py} L ${px-7*ux+6*vx} ${py-7*uy+6*vy}" fill="none" stroke="${g}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;}return q};
z+=arrows(132,58,1,0,2)+arrows(172,161,1,0,2);
const len=Math.hypot(41,103),ux=41/len,uy=103/len;
z+=arrows(55,109,ux,uy,1)+arrows(249,109,ux,uy,1);
}
if(i===5){z=line(22,52,318,52,c,5)+line(22,164,318,164,c,5)+line(175,15,175,203,p,5)+right(175,52)+right(175,164)+L(217,35,'۹۰°')+L(219,151,'?',g,23)}
return `<div class="quiz-art"><svg viewBox="0 0 340 220" role="img" aria-label="شکل مربوط به سؤال ${fa(i+1)}">${z}</svg></div>`;
}
function stage7(){return `<h2>🏆 ایستگاه ۷: مسابقه استاد هندسه</h2><p>شش چالش نهایی از مفاهیم همین درس. بعد از هر پاسخ، دلیل را یاد می‌گیری.</p><div id="quizBox"></div><div id="feedback" class="answer">پاسخ را انتخاب کن و بررسی را بزن.</div><div id="certificate" class="hidden"></div>`}
function fixExplanation(text){return fixDegrees(text).replace(/۱۸۰ − ۱۵۵ = ۲۵/g,'<bdi dir="ltr" class="math">۱۸۰ − ۱۵۵ = ۲۵</bdi>').replace(/۱۸۰ − ۳۶ = ۱۴۴/g,'<bdi dir="ltr" class="math">۱۸۰ − ۳۶ = ۱۴۴</bdi>')}
function quizRender(){const q=quiz[quizIndex];chosen=null;$('quizBox').innerHTML=`<div class="play"><span class="badge">سؤال ${fa(quizIndex+1)} از ${fa(quiz.length)}</span><h3>${fixDegrees(q.q)}</h3>${quizGraphic(quizIndex)}${eq(fixMath(q.e.replace(/؟/g,'?')))}<div class="choice">${q.o.map((v,i)=>`<button class="btn" data-opt="${i}">${math(v)}</button>`).join('')}</div><div class="controls"><button class="btn primary" id="submitQuiz">ثبت پاسخ</button><button class="btn" id="nextQuiz" disabled>سؤال بعدی ←</button></div></div>`;$('quizBox').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(quizDone.has(quizIndex))return;chosen=+b.dataset.opt;$('quizBox').querySelectorAll('[data-opt]').forEach(x=>x.classList.toggle('selected',x===b))});$('submitQuiz').onclick=()=>{if(chosen===null){reply('ابتدا یک گزینه انتخاب کن.');return;}let ok=chosen===q.a;reply((ok?'آفرین! ':'این گزینه درست نیست. ')+fixExplanation(q.why),ok);if(ok){quizDone.add(quizIndex);award('7:'+quizIndex);$('nextQuiz').disabled=false;$('submitQuiz').disabled=true;$('quizBox').querySelectorAll('[data-opt]').forEach(b=>{b.disabled=true;if(+b.dataset.opt===q.a)b.classList.add('good')})}};$('nextQuiz').onclick=()=>{if(quizIndex<quiz.length-1){quizIndex++;quizRender();$('feedback').textContent='سؤال بعدی را حل کن.';requestAnimationFrame(()=>{const y=$('quizBox').getBoundingClientRect().top+window.scrollY-12;window.scrollTo({top:y,behavior:'smooth'})})}else{const earnedCount=quizDone.size;$('quizBox').innerHTML='';$('feedback').className='answer ok';$('feedback').textContent='آفرین! همه سؤال‌های مسابقه را درست حل کردی.';$('certificate').classList.remove('hidden');$('certificate').innerHTML=`<div class="play" style="text-align:center"><div style="font-size:3rem">🏆✨</div><h2>نشان استاد هندسه</h2><p>تو ${fa(earnedCount)} چالش را با موفقیت پشت سر گذاشتی!</p><p>ستاره‌های تو: ${fa(points)} ⭐</p><button class="btn" id="restartQuiz">تکرار مسابقه</button></div>`;$('restartQuiz').onclick=()=>{quizIndex=0;quizDone.clear();$('certificate').classList.add('hidden');quizRender()}}}}
const renders=[stage1,stage2,stage3,stage4,stage5,stage6,stage7];
function render(){$('content').innerHTML=renders[stage]();updateStatus();if(stage===0){railUpdate();$('railRange').oninput=railUpdate;document.querySelectorAll('[data-rail]').forEach(b=>b.onclick=()=>reply(b.dataset.rail==='yes'?'درست است! با ثابت ماندن فاصله و جهت، ریل‌ها موازی‌اند.':'فاصله تغییر کرده، اما جهت دو ریل یکسان است؛ پس هنوز موازی‌اند.',b.dataset.rail==='yes'))}if(stage===1){angleUpdate();$('angleRange').oninput=angleUpdate;const art=$('angleArt');art.onpointerdown=e=>{draggingAngle={x:e.clientX,shift:angleShift};art.setPointerCapture(e.pointerId)};art.onpointermove=e=>{if(!draggingAngle)return;const scale=340/art.getBoundingClientRect().width;const a=+$('angleRange').value,r=a*Math.PI/180;let shift=draggingAngle.shift+(e.clientX-draggingAngle.x)*scale;const min=-35,max=35;angleShift=Math.max(min,Math.min(max,shift));angleUpdate()};art.onpointerup=art.onpointercancel=()=>draggingAngle=null;document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>reply(b.dataset.angle==='60'?'آفرین! زاویه‌های متناظر برابرند.':'زاویه '+deg(120)+' مکمل زاویه '+deg(60)+' است، نه متناظر آن.',b.dataset.angle==='60'))}if(stage===2){perpUpdate();$('perpRange').oninput=perpUpdate;$('checkPerp').onclick=()=>reply(+$('perpRange').value===90?'آفرین! دو خط با زاویه ۹۰° بر هم عمودند.':'هنوز زاویه قائمه نشده؛ خط صورتی را روی ۹۰° تنظیم کن.',+$('perpRange').value===90)}if(stage===3){gridUpdate();for(let [id,delta,key] of [['rxDown',-1,'x'],['rxUp',1,'x'],['ryDown',-1,'y'],['ryUp',1,'y']])$(id).onclick=()=>{if(key==='x')rx=Math.max(1,Math.min(6,rx+delta));else ry=Math.max(1,Math.min(6,ry+delta));gridUpdate()};$('gridCheck').onclick=()=>reply(rx===3&&ry===2?'عالی! حرکت ۳ خانه به راست و ۲ خانه به بالا در هر دو خط یکسان است.':'هنوز جهت دو خط یکسان نیست؛ الگوی ۳ خانه راست و ۲ خانه بالا را امتحان کن.',rx===3&&ry===2)}if(stage===4)lawRender();if(stage===5){shapeUpdate();$('skewRange').oninput=shapeUpdate;$('triRange').oninput=shapeUpdate;$('shapeCheck').onclick=()=>reply(+$('triRange').value===0?'آفرین! رأس بالای وسط قاعده قرار گرفت. خط وسط، محور تقارن و عمودمنصف قاعده است.':'برای داشتن دو ساق برابر، رأس باید دقیقاً بالای وسط قاعده باشد.',+$('triRange').value===0)}if(stage===6)quizRender()}
$('prev').onclick=()=>go(stage-1);$('next').onclick=()=>stage===6?$('certificate').scrollIntoView({behavior:'smooth',block:'center'}):go(stage+1);drawNav();render();
</script></body></html>
