<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160e35"><title>ماجراجویی در سرزمین اعداد صحیح | آکادمی ریاضی دهقان</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');
:root{--bg:#160d32;--panel:#2c2053;--panel2:#3b2a69;--line:#7763a2;--pink:#ff7cc6;--aqua:#68e6dc;--gold:#ffd86d;--ink:#fff;--muted:#dfd2ef}*{box-sizing:border-box}html,body{max-width:100%;margin:0}body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 15% 0,#4b2877,transparent 42%),radial-gradient(ellipse at 100% 35%,#1c4772,transparent 45%),var(--bg);line-height:1.8;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:not-allowed}.wrap{width:min(940px,100%);margin:auto;padding:18px 14px 45px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.back{color:var(--aqua);text-decoration:none;font-size:.85rem}.pill{border:1px solid #9d75b8;border-radius:100px;background:#56316e;padding:6px 14px;color:#ffe6a8;font-size:.85rem}.hero{text-align:center;padding:20px 4px}.hero h1{font-size:clamp(1.6rem,6vw,2.8rem);line-height:1.6;margin:8px 0;color:#fff}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);font-size:.94rem}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.stat{background:#443064;border:1px solid var(--line);border-radius:16px;padding:7px 13px;font-size:.83rem}.progress{height:10px;background:#4a3768;border-radius:30px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--aqua));width:0;transition:width .3s}.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}.map button{min-width:0;border:1px solid var(--line);border-radius:16px;background:#382553;color:white;padding:10px 4px;font-size:.75rem;line-height:1.6}.map button.active{background:#68428c;outline:2px solid var(--gold)}.map .emoji{display:block;font-size:1.65rem}.panel{background:linear-gradient(145deg,#39275e,#251940);border:1px solid var(--line);border-radius:24px;padding:clamp(14px,4vw,28px);box-shadow:0 14px 35px #09021d40;min-width:0}.panel h2{font-size:1.4rem;color:var(--gold);margin:0 0 8px}.panel h3{color:var(--aqua);font-size:1.07rem}.hint{background:#4c366c;border-right:4px solid var(--aqua);padding:12px;border-radius:14px;margin:14px 0;color:#fff;overflow-wrap:anywhere}.mission{background:#241939;border:1px solid #69518e;border-radius:20px;padding:16px;margin:16px 0;min-width:0}.mission h3{margin:0 0 8px}.math{direction:ltr;unicode-bidi:isolate;text-align:center;display:block;max-width:100%;overflow-wrap:anywhere;word-break:normal;font-family:Vazirmatn,Tahoma,sans-serif;font-weight:800;font-size:clamp(1rem,4.5vw,1.5rem);line-height:1.9;background:#1a1331;border:1px solid #66528b;border-radius:14px;padding:10px 6px;margin:12px 0}.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}.btn{background:#50376f;color:white;border:1px solid #9d7bc0;border-radius:15px;padding:10px 14px;min-height:46px;font-weight:700}.btn.primary{background:linear-gradient(115deg,#ff80bc,#bd84ff);color:#25143e;border:0}.btn.small{padding:7px 12px;min-height:40px}.feedback{border-radius:14px;background:#4a3568;padding:12px;margin:12px 0;min-height:48px;overflow-wrap:anywhere}.feedback.ok{background:#1e6658}.feedback.bad{background:#763d52}.nav{display:flex;justify-content:space-between;gap:8px;margin:20px 0}.nav .btn{flex:1}.axisbox{position:relative;margin:18px auto 6px;padding:24px 12px 18px;background:#1c1536;border-radius:18px;max-width:100%}.axis{position:relative;height:90px;margin:0 6px;touch-action:none}.axis .line{position:absolute;top:44px;left:0;right:0;height:4px;background:#9bdcf0;border-radius:10px}.tick{position:absolute;top:34px;transform:translateX(-50%);width:1px;height:22px;background:#9bdcf0}.tick label{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:.72rem;color:white;white-space:nowrap}.marker{position:absolute;top:0;transform:translateX(-50%);font-size:1.6rem;transition:left .22s;z-index:2;line-height:1}.marker .num{font-size:.73rem;text-align:center;background:#423264;border-radius:8px;padding:1px 5px;white-space:nowrap}.marker.mirror{top:0;color:var(--aqua)}.axisnote{font-size:.78rem;color:var(--muted);text-align:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choices button{background:#463466;color:#fff;border:2px solid #8163a4;border-radius:15px;min-width:0;padding:10px 6px;font-weight:700}.choices button.sel{border-color:var(--aqua);background:#245c5a}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:300px;margin:12px auto}.keypad button{min-height:43px;border-radius:12px;background:#514071;color:white;border:1px solid #a08bbf;font-size:1.1rem}.magic{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:320px;margin:16px auto;direction:ltr}.magic button{aspect-ratio:1.25;background:#30204d;color:white;border:2px solid #9a79c6;border-radius:12px;font-size:1.35rem;font-weight:800;min-width:0}.magic button.fixed{background:#5b416e;border-color:#6e5a8b}.magic button.selected{border-color:var(--gold);background:#684681}.sub{font-size:.8rem;color:var(--muted)}.cardrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mini{border-radius:15px;background:#4a346d;padding:12px;min-width:0}.mini .math{font-size:.95rem}.footer{text-align:center;margin-top:35px;color:#d7c8e8;font-size:.84rem}.footer p{margin:3px}.footer a{color:var(--aqua)}.hide{display:none!important}@media(max-width:390px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.cardrow{grid-template-columns:1fr}.wrap{padding:12px 9px}.panel{padding:13px}.btn{padding:9px 10px}.hero h1{font-size:1.5rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="../../chapter-01.html">↩ بازگشت به فصل اول</a><span class="pill">🎮 آموزش بازی‌محور • صفحات ۲ تا ۵</span></div><header class="hero"><div style="font-size:2rem">🚀 ✨ 🪞 🏰</div><h1>ماجراجویی در <span>سرزمین اعداد صحیح</span></h1><p>با حرکت، کشف، ساختن و حل معما یاد بگیر!</p><div class="stats"><div class="stat">⭐ ستاره‌ها: <b id="stars">۰</b></div><div class="stat">🧭 مرحله: <b id="stageNum">۱ از ۶</b></div><div class="stat">🏆 بهترین رکورد: <b id="best">۰</b></div></div><div class="progress"><div id="progress"></div></div></header><div class="map" id="map"></div><main id="game" class="panel" aria-live="polite"></main><div class="nav"><button class="btn" id="prev">مرحله قبل</button><button class="btn primary" id="next">مرحله بعد ←</button></div><footer class="footer"><p>آکادمی ریاضی دهقان</p><p>طراح آموزشی: دبیر ریاضی دهقان</p><p>ریاضی پایه هشتم • یادآوری عددهای صحیح</p><p><a href="../../contact.html">ارتباط با مدرس</a></p></footer></div><script>
'use strict';
const fa=n=>String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]).replace(/-/g,'−');
const fmt=n=>(n>0?'+':'')+String(n);
const math=s=>`<div class="math" dir="ltr"><bdi>${fa(s)}</bdi></div>`;
const $=id=>document.getElementById(id);
const stages=[['🚀','سفر روی محور'],['🪞','آینه اعداد'],['⚙️','کارخانه عملیات'],['🔎','کارآگاه ریاضی'],['🔐','رمز علامت‌ها'],['🏰','قلعه و آزمون']];
let stage=0,stars=0,earned=new Set(),ship=-2,mirror=-4,selectedCell=null,magic=[-8,null,null,null,-2,-6,null,null,4],signs=[1,1,1],quizIdx=0,quizChosen=null,quizDone=new Set();
const quiz=[
{q:'کدام عدد صحیح بین دو عدد زیر قرار دارد؟',exp:'-5 < x < +3',opts:[-6,-4,4,5],ans:1,why:'عدد −۴ از −۵ بزرگ‌تر و از +۳ کوچک‌تر است.'},
{q:'حاصل عبارت زیر چند است؟',exp:'-8 + 6 - 12 + 14 - 20 + 22',opts:[2,-2,4,-4],ans:0,why:'با گروه‌بندی عددهای مثبت و منفی، حاصل +۲ می‌شود.'},
{q:'ترتیب عملیات را رعایت کن. حاصل چیست؟',exp:'3 - 4 × 5',opts:[-5,-17,5,17],ans:1,why:'ابتدا ۴×۵=۲۰ و سپس ۳−۲۰=−۱۷.'},
{q:'کدام عبارت درست است؟',exp:'-8 - 4 ÷ 2',opts:[-6,-10,-12,2],ans:1,why:'ابتدا ۴÷۲=۲ و سپس −۸−۲=−۱۰.'},
{q:'حاصل جمع زیر چند است؟',exp:'1 + 2 + 3 + ... + 100',opts:[5000,5050,5100,10100],ans:1,why:'۵۰ جفت داریم که حاصل هر جفت ۱۰۱ است؛ ۵۰×۱۰۱=۵۰۵۰.'}
];
function score(key,points=10){if(!earned.has(key)){earned.add(key);stars+=points;$('stars').textContent=fa(stars);try{const old=Number(localStorage.getItem('dehghan-integers-best-v3')||0);if(stars>old)localStorage.setItem('dehghan-integers-best-v3',String(stars));$('best').textContent=fa(Math.max(old,stars));}catch(e){}}}
function feedback(id,msg,ok){const el=$(id);if(el){el.className='feedback '+(ok?'ok':'bad');el.textContent=msg;}}
function axis(id,range,value,mirrorValue=false,shipMode=false){const ticks=Array.from({length:range*2+1},(_,i)=>{const n=i-range;return `<div class="tick" style="left:${i/(range*2)*100}%"><label>${fa(n)}</label></div>`}).join('');const point=(n,icon,cls)=>`<div class="marker ${cls}" style="left:${(n+range)/(2*range)*100}%"><span>${icon}</span><div class="num">${fa(fmt(n))}</div></div>`;return `<div class="axisbox"><div id="${id}" class="axis" data-range="${range}"><div class="line"></div>${ticks}${point(value,shipMode?'🚀':'🔴','')}${mirrorValue?point(-value,'🔵','mirror'):''}${shipMode?point(3,'🚩','mirror'):''}</div><div class="axisnote">اعداد روی محور از چپ به راست بزرگ‌تر می‌شوند</div></div>`;}
function refresh(){ $('stageNum').textContent=fa(stage+1)+' از ۶';$('progress').style.width=((stage+1)/6*100)+'%';$('map').innerHTML=stages.map(([ico,title],i)=>`<button class="${i===stage?'active':''}" data-stage="${i}"><span class="emoji">${ico}</span>${title}</button>`).join('');$('map').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.stage)));$('prev').disabled=stage===0;$('next').textContent=stage===5?'مشاهده کارنامه 🏆':'مرحله بعد ←';$('next').onclick=()=>stage===5?report():go(stage+1);const views=[renderShip,renderMirror,renderOps,renderDetective,renderSigns,renderFinal];views[stage]();window.scrollTo({top:0,behavior:'instant'});}
function go(i){stage=Math.max(0,Math.min(5,i));refresh()}
function renderShip(){ $('game').innerHTML=`<h2>🚀 مرحله ۱: سفر روی محور</h2><p>در محور اعداد، حرکت به راست یعنی افزایش و حرکت به چپ یعنی کاهش عدد.</p><div class="hint">سفینه از <strong>−۲</strong> شروع کرده است. آن را با حرکت <strong>۵ واحد به راست</strong> به پرچم برسان.</div>${axis('shipAxis',6,ship,false,true)}<div class="btns"><button class="btn small" id="shipLeft">← یک واحد چپ</button><button class="btn small" id="shipRight">یک واحد راست →</button><button class="btn small" id="shipReset">شروع دوباره</button></div><div id="shipFeed" class="feedback">مقصد سفینه: +۳</div><div class="mission"><h3>🧠 نکته کتاب</h3><p>برای حرکت از −۲ به +۳، پنج گام به سمت راست می‌رویم.</p>${math('-2 + 5 = +3')}</div>`;const update=()=>{const el=$('shipAxis');el.outerHTML=axis('shipAxis',6,ship,false,true).match(/<div id="shipAxis"[\s\S]*?<\/div><div class="axisnote">/)[0].replace('<div class="axisnote">','');};const draw=()=>{const a=$('shipAxis');a.querySelectorAll('.marker')[0].style.left=((ship+6)/12*100)+'%';a.querySelectorAll('.marker .num')[0].textContent=fa(fmt(ship));feedback('shipFeed',ship===3?'آفرین! سفینه به +۳ رسید و پنج واحد به راست حرکت کرد.':'موقعیت فعلی سفینه: '+fa(fmt(ship)),ship===3);if(ship===3)score('ship');};$('shipLeft').onclick=()=>{ship=Math.max(-6,ship-1);draw()};$('shipRight').onclick=()=>{ship=Math.min(6,ship+1);draw()};$('shipReset').onclick=()=>{ship=-2;draw()};}
function renderMirror(){ $('game').innerHTML=`<h2>🪞 مرحله ۲: آینه جادویی اعداد</h2><p>هر عدد صحیح، قرینه‌ای در سوی دیگر صفر دارد. فاصله دو نقطه از صفر یکسان است.</p><div class="hint">نقطه صورتی را روی محور با انگشت بکش یا از دکمه‌ها استفاده کن؛ نقطه آبی هم‌زمان در طرف مقابل حرکت می‌کند.</div>${axis('mirrorAxis',6,mirror,true)}<div class="btns"><button class="btn small" id="mirrorLeft">← یک واحد چپ</button><button class="btn small" id="mirrorRight">یک واحد راست →</button></div><div id="mirrorFeed" class="feedback">دو نقطه را مشاهده کن.</div><div class="mission"><h3>🎯 مأموریت</h3><p>نقطه صورتی را روی <strong>−۳</strong> ببر تا قرینه آن روی <strong>+۳</strong> قرار بگیرد.</p></div>`;const draw=()=>{const a=$('mirrorAxis');a.querySelectorAll('.marker').forEach((m,i)=>{const n=i===0?mirror:-mirror;m.style.left=((n+6)/12*100)+'%';m.querySelector('.num').textContent=fa(fmt(n))});feedback('mirrorFeed','نقطه صورتی: '+fa(fmt(mirror))+' | نقطه آبی: '+fa(fmt(-mirror))+(mirror===-3?' — مأموریت کامل شد!':''),mirror===-3);if(mirror===-3)score('mirror')};$('mirrorLeft').onclick=()=>{mirror=Math.max(-6,mirror-1);draw()};$('mirrorRight').onclick=()=>{mirror=Math.min(6,mirror+1);draw()};const a=$('mirrorAxis');const move=e=>{const rect=a.getBoundingClientRect();mirror=Math.max(-6,Math.min(6,Math.round(((e.clientX-rect.left)/rect.width)*12-6)));draw()};a.addEventListener('pointerdown',e=>{a.setPointerCapture(e.pointerId);move(e)});a.addEventListener('pointermove',e=>{if(e.buttons)move(e)});}
function renderOps(){const examples=[['جمع و تفریق','-4 - 8','وقتی ۸ واحد از −۴ به چپ برویم، به −۱۲ می‌رسیم.','−۱۲'],['ضرب علامت‌دار','-4 × (-3)','حاصل ضرب دو عدد منفی، مثبت است.','+۱۲'],['تقسیم علامت‌دار','-12 ÷ 2','تقسیم عدد منفی بر عدد مثبت، حاصل منفی دارد.','−۶'],['ترتیب عملیات','-8 - 3 × 5','ابتدا ضرب: ۳×۵=۱۵؛ سپس −۸−۱۵=−۲۳.','−۲۳']];$('game').innerHTML=`<h2>⚙️ مرحله ۳: کارخانه عملیات</h2><p>چهار دستگاه را روشن کن تا قانون هر عمل را کشف کنی.</p><div class="cardrow">${examples.map((x,i)=>`<div class="mini"><h3>${x[0]}</h3>${math(x[1])}<button class="btn small" data-op="${i}">⚡ روشن کن</button><div class="feedback hide" id="op${i}"></div></div>`).join('')}</div><div class="mission"><h3>🎮 چالش ترتیب عملیات</h3><p>حاصل عبارت زیر را پیدا کن:</p>${math('-16 ÷ 2 × 3 - 4')}<div class="choices" id="opChoices">${[-28,-16,-10,20].map((v,i)=>`<button data-v="${v}">${fa(fmt(v))}</button>`).join('')}</div><div id="opFeedback" class="feedback">ابتدا تقسیم و ضرب را از چپ به راست انجام بده.</div></div>`;$('game').querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.op),el=$('op'+i);el.classList.remove('hide');el.textContent=examples[i][2]+' پاسخ: '+examples[i][3];el.classList.add('ok');score('op'+i,5)});$('opChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.v);feedback('opFeedback',v===-28?'درست است! −۱۶÷۲=−۸، سپس −۸×۳=−۲۴ و −۲۴−۴=−۲۸.':'دوباره بررسی کن: تقسیم و ضرب هم‌اولویت‌اند و از چپ به راست انجام می‌شوند.',v===-28);if(v===-28)score('opQuiz')});}
function renderDetective(){const cases=[['پرونده ۱','-43 + 37 - 29 = -35',true,'ابتدا −۴۳+۳۷=−۶ و سپس −۶−۲۹=−۳۵.'],['پرونده ۲','-43 + 37 - 29 = 29 - 37 + 43',false,'سمت راست برابر ۳۵ است، ولی سمت چپ −۳۵ است.'],['پرونده ۳','10 + 3 - 7 - 2 = 13 - 9 = 4',true,'۷ و ۲ را می‌توان با هم جمع کرد؛ ۱۳−۹=۴.']];$('game').innerHTML=`<h2>🔎 مرحله ۴: کارآگاه ریاضی</h2><p>در کتاب، چند دانش‌آموز یک عبارت را با روش‌های مختلف حل کرده‌اند. اینجا درستی روش‌ها را بررسی می‌کنی.</p>${cases.map((x,i)=>`<div class="mission"><h3>${x[0]}</h3><p>آیا تساوی زیر درست است؟</p>${math(x[1])}<div class="btns"><button class="btn small" data-case="${i}" data-yes="1">درست است</button><button class="btn small" data-case="${i}" data-yes="0">اشتباه است</button></div><div id="detect${i}" class="feedback">پاسخت را انتخاب کن.</div></div>`).join('')}`;$('game').querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.case),ok=(b.dataset.yes==='1')===cases[i][2];feedback('detect'+i,(ok?'آفرین! ':'دوباره دقت کن. ')+cases[i][3],ok);if(ok)score('detect'+i,7)});}
function renderSigns(){ $('game').innerHTML=`<h2>🔐 مرحله ۵: رمزگشایی علامت‌ها</h2><p>برگرفته از فعالیت صفحه ۴ کتاب: علامت‌ها را عوض کن تا حاصل بیشترین مقدار ممکن شود.</p><div class="mission"><p>روی هر دکمه علامت بزن:</p><div class="btns" style="align-items:center"><strong>${fa('−5')}</strong>${[-6,3,-9].map((n,i)=>`<button class="btn small" data-sign="${i}">${signs[i]===1?'+':'−'}</button><strong>(${fa(fmt(n))})</strong>`).join('')}</div><div class="math" id="signTotal"></div><div id="signFeedback" class="feedback">علامت‌ها را تغییر بده.</div></div><div class="hint">راهنما: برای بزرگ‌تر کردن حاصل، به اثر جمع یا تفریق عدد منفی توجه کن.</div>`;const draw=()=>{const val=-5+[-6,3,-9].reduce((s,n,i)=>s+signs[i]*n,0);$('signTotal').textContent='حاصل = '+fa(val);feedback('signFeedback',val===13?'عالی! بیشترین حاصل +۱۳ است.':'آیا می‌توانی حاصل را از '+fa(val)+' بزرگ‌تر کنی؟',val===13);if(val===13)score('signs')};$('game').querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.sign);signs[i]*=-1;b.textContent=signs[i]===1?'+':'−';draw()});draw()}
function renderFinal(){ $('game').innerHTML=`<h2>🏰 مرحله ۶: قلعه مربع جادویی</h2><p>مطابق تمرین صفحه ۵، خانه‌ها را طوری کامل کن که مجموع هر سطر، هر ستون و هر قطر برابر شود.</p><div class="hint">چهار خانه از قبل پر شده‌اند. برای وارد کردن عدد منفی، از صفحه‌کلید اختصاصی زیر استفاده کن.</div><div class="magic" id="magic">${magic.map((v,i)=>`<button data-cell="${i}" class="${[0,4,5,8].includes(i)?'fixed':''} ${selectedCell===i?'selected':''}">${v===null?'؟':fa(v)}</button>`).join('')}</div><p class="sub" style="text-align:center">خانه انتخاب‌شده: <span id="cellName">${selectedCell===null?'هیچ‌کدام':fa(selectedCell+1)}</span></p><div class="keypad" id="keypad">${[1,2,3,4,5,6,7,8,9,'−',0,'پاک'].map(x=>`<button data-key="${x}">${typeof x==='number'?fa(x):x}</button>`).join('')}</div><div class="btns"><button class="btn primary" id="checkMagic">بررسی مربع</button><button class="btn" id="resetMagic">پاک‌کردن خانه‌های خالی</button></div><div class="feedback" id="magicFeedback">یکی از خانه‌های علامت سؤال را انتخاب کن.</div><div class="mission"><h3>🏆 آزمون قهرمانی</h3><p>پنج پرسش محاسبه‌شده و کنترل‌شده؛ پس از هر پاسخ، دلیل آن را می‌بینی.</p><div id="quizArea"></div></div>`;const draw=()=>{$('magic').querySelectorAll('button').forEach((b,i)=>{b.textContent=magic[i]===null?'؟':fa(magic[i]);b.classList.toggle('selected',i===selectedCell)});$('cellName').textContent=selectedCell===null?'هیچ‌کدام':fa(selectedCell+1)};$('magic').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.cell);if([0,4,5,8].includes(i))return;selectedCell=i;draw()});$('keypad').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(selectedCell===null)return;const k=b.dataset.key,cur=magic[selectedCell];if(k==='پاک')magic[selectedCell]=null;else if(k==='−')magic[selectedCell]=cur===null?'-':typeof cur==='number'?-cur:cur==='-'?null:'-';else{const digit=Number(k);magic[selectedCell]=cur==='-'?-digit:cur===null?digit:Math.max(-99,Math.min(99,Number(String(cur)+k)))}draw()});$('checkMagic').onclick=()=>{if(magic.some(v=>typeof v!=='number'))return feedback('magicFeedback','هنوز خانه‌های خالی داری. همه را کامل کن.',false);const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],sums=lines.map(ids=>ids.reduce((s,i)=>s+magic[i],0)),ok=sums.every(x=>x===sums[0]);feedback('magicFeedback',ok?'تبریک! مجموع همه سطرها، ستون‌ها و قطرها '+fa(sums[0])+' است.':'هنوز مجموع‌ها برابر نیستند؛ سطرها، ستون‌ها و قطرها را دوباره بررسی کن.',ok);if(ok)score('magic',25)};$('resetMagic').onclick=()=>{magic=[-8,null,null,null,-2,-6,null,null,4];selectedCell=null;draw();feedback('magicFeedback','خانه‌ها پاک شدند. دوباره تلاش کن.',false)};renderQuiz();}
function renderQuiz(){const q=quiz[quizIdx];$('quizArea').innerHTML=`<div class="mission"><p style="color:var(--aqua)">سؤال ${fa(quizIdx+1)} از ${fa(quiz.length)}</p><h3>${q.q}</h3>${math(q.exp)}<div class="choices">${q.opts.map((x,i)=>`<button data-answer="${i}" class="${quizChosen===i?'sel':''}">${fa(fmt(x))}</button>`).join('')}</div><div id="quizFeed" class="feedback">یک گزینه انتخاب کن.</div><div class="btns"><button class="btn primary" id="checkQuiz">ثبت پاسخ</button><button class="btn" id="nextQuiz" ${quizDone.has(quizIdx)?'':'disabled'}>${quizIdx===quiz.length-1?'کارنامه':'سؤال بعدی ←'}</button></div></div>`;$('quizArea').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quizChosen=Number(b.dataset.answer);$('quizArea').querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('sel',x===b));});$('checkQuiz').onclick=()=>{if(quizChosen===null)return feedback('quizFeed','ابتدا یک پاسخ انتخاب کن.',false);const ok=quizChosen===q.ans;feedback('quizFeed',(ok?'آفرین! ':'این گزینه درست نیست. ')+q.why,ok);if(ok){score('quiz'+quizIdx,10);quizDone.add(quizIdx);$('nextQuiz').disabled=false}};$('nextQuiz').onclick=()=>{if(quizIdx<quiz.length-1){quizIdx++;quizChosen=null;renderQuiz()}else report()};}
function report(){const passed=quizDone.size;const all=passed===5;const badge=all?'🥇 قهرمان طلایی':passed>=3?'🥈 قهرمان نقره‌ای':'🥉 قهرمان در حال پیشرفت';$('game').innerHTML=`<h2>🏆 کارنامه ماجراجویی</h2><div class="mission" style="text-align:center"><div style="font-size:3rem">${all?'🏆':'🌟'}</div><h3>${badge}</h3><p>ستاره‌های کسب‌شده: <strong>${fa(stars)}</strong></p><p>سؤال‌های درست آزمون: <strong>${fa(passed)} از ۵</strong></p><p>برای بهترشدن، می‌توانی به هر مرحله برگردی و دوباره تمرین کنی.</p><button class="btn primary" id="restart">شروع دوباره بازی</button></div>`;$('restart').onclick=()=>{stage=0;stars=0;earned.clear();ship=-2;mirror=-4;magic=[-8,null,null,null,-2,-6,null,null,4];signs=[1,1,1];quizIdx=0;quizChosen=null;quizDone.clear();$('stars').textContent='۰';refresh()};window.scrollTo({top:0,behavior:'smooth'})}
try{$('best').textContent=fa(Number(localStorage.getItem('dehghan-integers-best-v3')||0))}catch(e){}refresh();
</script></body></html>
